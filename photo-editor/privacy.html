<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- This page used to be the photo editor's standalone privacy disclosure.
       All 20 tools now share one page at /privacy, so this is a redirect
       stub: the URL may be indexed or bookmarked, and static hosting cannot
       issue a real 301. The canonical tag tells crawlers where the content
       lives; the meta refresh moves people there; the link below covers anyone
       whose browser ignores the refresh. -->
  <title>Privacy — NoAdsTools</title>
  <link rel="canonical" href="https://noadstools.com/privacy">
  <meta name="robots" content="noindex, follow">
  <meta http-equiv="refresh" content="0; url=/privacy#photo-editor">

  <link rel="icon" type="image/png" sizes="32x32"   href="/photo-editor/img/favicon-light-32.png"  media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/png" sizes="192x192" href="/photo-editor/img/favicon-light-192.png" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/png" sizes="32x32"   href="/photo-editor/img/favicon-dark-32.png"   media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/png" sizes="192x192" href="/photo-editor/img/favicon-dark-192.png"  media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="/shared/shell.css">
</head>
<body>
  <main>
    <article class="prose">
      <h1>This page has moved</h1>
      <p>The privacy disclosure for every NoAdsTools tool, including the photo editor, now lives on one page.</p>
      <p><a href="/privacy#photo-editor">Go to the privacy page</a>.</p>
      <p>The full source is on <a href="https://github.com/Dan512/NoAdsTools" target="_blank" rel="noopener">GitHub</a> under the AGPL-3.0 license.</p>
    </article>
  </main>
</body>
</html>
